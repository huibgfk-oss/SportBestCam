name: Build SportBestCam APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout SportBestCam
        uses: actions/checkout@v4

      - name: Clone patched Media3 required by SportBestCam
        run: |
          git clone --depth 1 https://github.com/anonfaded/media3-patched.git media3-patched
          echo "media3.patched.path=${{ github.workspace }}/media3-patched" >> local.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore persistent SportBestCam signing key
        env:
          SPORTBESTCAM_DEBUG_KEYSTORE_B64: ${{ secrets.SPORTBESTCAM_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail

          if [ -z "${SPORTBESTCAM_DEBUG_KEYSTORE_B64:-}" ]; then
            echo "ERROR: GitHub secret SPORTBESTCAM_DEBUG_KEYSTORE_B64 is missing."
            echo "Run SETUP_SPORTBESTCAM_SIGNING.sh once from Termux before pushing."
            exit 1
          fi

          SOURCE_P12="$RUNNER_TEMP/sportbestcam-debug.p12"
          DEBUG_KEYSTORE="$HOME/.android/debug.keystore"

          mkdir -p "$HOME/.android"
          rm -f "$SOURCE_P12" "$DEBUG_KEYSTORE"

          printf '%s' "$SPORTBESTCAM_DEBUG_KEYSTORE_B64" \
            | base64 --decode > "$SOURCE_P12"

          test -s "$SOURCE_P12"

          openssl pkcs12 \
            -in "$SOURCE_P12" \
            -passin pass:android \
            -noout

          keytool -importkeystore \
            -srckeystore "$SOURCE_P12" \
            -srcstoretype PKCS12 \
            -srcstorepass android \
            -srcalias androiddebugkey \
            -srckeypass android \
            -destkeystore "$DEBUG_KEYSTORE" \
            -deststoretype JKS \
            -deststorepass android \
            -destalias androiddebugkey \
            -destkeypass android \
            -noprompt

          chmod 600 "$DEBUG_KEYSTORE"

          keytool -list \
            -keystore "$DEBUG_KEYSTORE" \
            -storepass android \
            -alias androiddebugkey >/dev/null

          CERT_SHA256="$(
            keytool -list -v \
              -keystore "$DEBUG_KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' \
              | head -n1
          )"

          echo "SPORTBESTCAM_CERT_SHA256=$CERT_SHA256" >> "$GITHUB_ENV"
          echo "Signing SHA256: $CERT_SHA256"

          # Force the Android Gradle debug build to use THIS exact persistent key.
          {
            echo "KEYSTORE_FILE=$DEBUG_KEYSTORE"
            echo "KEYSTORE_PASSWORD=android"
            echo "KEY_ALIAS=androiddebugkey"
            echo "KEY_PASSWORD=android"
          } >> local.properties

          echo "Persistent signing config written to local.properties."

      - name: Set monotonic CI versionCode
        run: |
          set -euo pipefail

          CI_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))

          sed -i -E \
            "s/versionCode = [0-9]+/versionCode = ${CI_VERSION_CODE}/" \
            app/build.gradle.kts

          echo "CI_VERSION_CODE=$CI_VERSION_CODE" >> "$GITHUB_ENV"
          echo "CI versionCode: $CI_VERSION_CODE"

      - name: Resolve version name
        run: |
          set -euo pipefail

          BASE_VERSION="$(
            sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' \
              app/build.gradle.kts \
              | head -n1
          )"

          DEBUG_SUFFIX="$(
            sed -n 's/.*versionNameSuffix = "\([^"]*\)".*/\1/p' \
              app/build.gradle.kts \
              | head -n1
          )"

          FULL_VERSION="${BASE_VERSION}${DEBUG_SUFFIX}"

          test -n "$FULL_VERSION"

          echo "SPORTBESTCAM_FULL_VERSION=$FULL_VERSION" >> "$GITHUB_ENV"
          echo "Version: $FULL_VERSION"

      - name: Verify stable debug signing configuration
        run: |
          set -euo pipefail

          grep -q '^KEYSTORE_FILE=' local.properties
          grep -q '^KEYSTORE_PASSWORD=android$' local.properties
          grep -q '^KEY_ALIAS=androiddebugkey$' local.properties
          grep -q '^KEY_PASSWORD=android$' local.properties

          echo "Gradle stable-debug signing properties: present"

      - name: Build SportBestCam debug APK
        run: |
          ./gradlew assembleDefaultDebug \
            -PsportbestcamStableDebugSigning=true \
            --stacktrace \
            --no-daemon \
            --max-workers=2

      - name: Collect SportBestCam APK
        run: |
          set -euo pipefail

          mkdir -p out

          find app/build/outputs/apk \
            -name '*.apk' \
            -type f \
            | while read -r apk; do
                base="$(basename "$apk")"
                safe="${base/FadCam/SportBestCam}"
                safe="${safe/fadcam/SportBestCam}"
                cp "$apk" "out/$safe"
              done

          ls -lah out

      - name: Verify APK signing certificate
        run: |
          set -euo pipefail

          APKSIGNER="$(
            find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" \
              -type f -name apksigner \
              | sort -V \
              | tail -n1
          )"

          if [ -z "${APKSIGNER:-}" ] || [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: Android SDK apksigner was not found."
            exit 1
          fi

          echo "Using apksigner: $APKSIGNER"

          found=0

          for apk in out/*.apk; do
            [ -f "$apk" ] || continue
            found=1

            echo "=== $(basename "$apk") ==="

            "$APKSIGNER" verify --verbose --print-certs "$apk"

            RAW_APK_CERT="$(
              "$APKSIGNER" verify --print-certs "$apk" \
                | sed -n 's/^.*certificate SHA-256 digest: //p' \
                | head -n1
            )"

            APK_CERT="$(
              printf '%s' "$RAW_APK_CERT" \
                | tr -d '[:space:]:' \
                | tr '[:lower:]' '[:upper:]' \
                | sed 's/../&:/g; s/:$//'
            )"

            EXPECTED_CERT="$(
              printf '%s' "${SPORTBESTCAM_CERT_SHA256:-}" \
                | tr -d '[:space:]:' \
                | tr '[:lower:]' '[:upper:]' \
                | sed 's/../&:/g; s/:$//'
            )"

            echo "APK SHA256 certificate:      $APK_CERT"
            echo "Expected stable certificate: $EXPECTED_CERT"

            if [ -z "$APK_CERT" ]; then
              echo "ERROR: apksigner could not extract the APK signing certificate."
              exit 1
            fi

            if [ -n "$EXPECTED_CERT" ] \
                && [ "$APK_CERT" != "$EXPECTED_CERT" ]; then
              echo "ERROR: APK signing certificate differs from persistent key."
              exit 1
            fi
          done

          [ "$found" -eq 1 ]

          echo "All SportBestCam APKs use the persistent signing certificate."

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: SportBestCam-APK-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release for in-app updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="android-v${CI_VERSION_CODE}"
          TITLE="SportBestCam ${SPORTBESTCAM_FULL_VERSION} (build ${CI_VERSION_CODE})"

          cat > "$RUNNER_TEMP/release-notes.txt" <<EOF
          SportBestCam Android update

          Version: ${SPORTBESTCAM_FULL_VERSION}
          versionCode: ${CI_VERSION_CODE}
          Signing certificate SHA256: ${SPORTBESTCAM_CERT_SHA256}

          The SportBestCam in-app updater validates:
          - package name
          - higher versionCode
          - same signing certificate
          before opening the Android package installer.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk --clobber
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/release-notes.txt"
          else
            gh release create "$TAG" out/*.apk \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/release-notes.txt"
          fi

          echo "Published release: $TAG"
