name: Build SportBestCam APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout SportBestCam
        uses: actions/checkout@v4

      - name: Clone patched Media3 required by SportBestCam
        run: |
          git clone --depth 1 https://github.com/anonfaded/media3-patched.git media3-patched
          echo "media3.patched.path=${{ github.workspace }}/media3-patched" >> local.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore persistent SportBestCam signing key
        env:
          SPORTBESTCAM_DEBUG_KEYSTORE_B64: ${{ secrets.SPORTBESTCAM_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail

          if [ -z "${SPORTBESTCAM_DEBUG_KEYSTORE_B64:-}" ]; then
            echo "ERROR: GitHub secret SPORTBESTCAM_DEBUG_KEYSTORE_B64 is missing."
            echo "Run SETUP_SPORTBESTCAM_SIGNING.sh once from Termux before pushing."
            exit 1
          fi

          SOURCE_P12="$RUNNER_TEMP/sportbestcam-debug.p12"
          DEBUG_KEYSTORE="$HOME/.android/debug.keystore"

          mkdir -p "$HOME/.android"
          rm -f "$SOURCE_P12" "$DEBUG_KEYSTORE"

          if ! printf '%s' "$SPORTBESTCAM_DEBUG_KEYSTORE_B64" | base64 --decode > "$SOURCE_P12"; then
            echo "ERROR: SPORTBESTCAM_DEBUG_KEYSTORE_B64 is not valid Base64."
            exit 1
          fi

          if [ ! -s "$SOURCE_P12" ]; then
            echo "ERROR: decoded keystore is empty."
            exit 1
          fi

          echo "Persistent PKCS#12 keystore restored: $(stat -c%s "$SOURCE_P12") bytes"

          if ! openssl pkcs12 \
              -in "$SOURCE_P12" \
              -passin pass:android \
              -noout; then
            echo "ERROR: decoded secret is not the expected PKCS#12 keystore."
            exit 1
          fi

          keytool -importkeystore \
            -srckeystore "$SOURCE_P12" \
            -srcstoretype PKCS12 \
            -srcstorepass android \
            -srcalias androiddebugkey \
            -srckeypass android \
            -destkeystore "$DEBUG_KEYSTORE" \
            -deststoretype JKS \
            -deststorepass android \
            -destalias androiddebugkey \
            -destkeypass android \
            -noprompt

          chmod 600 "$DEBUG_KEYSTORE"

          keytool -list \
            -keystore "$DEBUG_KEYSTORE" \
            -storepass android \
            -alias androiddebugkey >/dev/null

          echo "Persistent SportBestCam signing key installed."
          echo "Certificate fingerprint:"
          keytool -list -v \
            -keystore "$DEBUG_KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            | grep -E 'SHA256:|SHA-256:' \
            | head -1 || true

      - name: Set monotonic CI versionCode
        run: |
          set -euo pipefail
          CI_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          sed -i -E "s/versionCode = [0-9]+/versionCode = ${CI_VERSION_CODE}/" app/build.gradle.kts
          echo "CI versionCode: ${CI_VERSION_CODE}"
          grep -n "versionCode =" app/build.gradle.kts | head -1

      - name: Build SportBestCam debug APK
        run: ./gradlew assembleDefaultDebug --stacktrace --no-daemon --max-workers=2

      - name: Collect SportBestCam APK
        run: |
          set -euo pipefail
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -type f | while read -r apk; do
            base="$(basename "$apk")"
            safe="${base/FadCam/SportBestCam}"
            safe="${safe/fadcam/SportBestCam}"
            cp "$apk" "out/$safe"
          done
          ls -lah out

      - name: Verify APK signing certificate
        run: |
          set -euo pipefail
          found=0
          for apk in out/*.apk; do
            [ -f "$apk" ] || continue
            found=1
            echo "=== $(basename "$apk") ==="
            keytool -printcert -jarfile "$apk" \
              | grep -E 'SHA256:|SHA-256:' \
              | head -1 || true
          done
          [ "$found" -eq 1 ]

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SportBestCam-APK-${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error
